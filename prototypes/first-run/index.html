<!-- THROWAWAY: interaction decisions only. No upload, image generation, network, persistent storage or real photo data. -->
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>照片有话说 · 使用与修改体验</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f1;color:#27372f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1240px;margin:auto;padding:30px 24px 70px}h1{font-size:clamp(28px,4vw,46px);font-weight:550;letter-spacing:-.04em;margin:10px 0}p{font-size:14px;line-height:1.8;color:#627169}.kicker{font-size:11px;letter-spacing:.14em;color:#6d8174}.intro{max-width:820px}.state{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid #cfd8cd;margin:26px 0 24px;padding:16px 0;gap:20px}.state dt{font-size:11px;color:#819084}.state dd{font-size:14px;margin:7px 0 0;line-height:1.5}.layout{display:grid;grid-template-columns:1fr 1.1fr;gap:28px}.panel{background:#fff;border:1px solid #dde3db;border-radius:12px;padding:22px}h2{font-size:19px;font-weight:550;margin:0 0 15px}h3{font-size:14px;margin:24px 0 10px}button{font:inherit;font-size:12px;padding:9px 12px;border:1px solid #cbd6ca;border-radius:5px;background:#fff;color:#3c5546;cursor:pointer;text-align:left}button:disabled{opacity:.4;cursor:default}button[aria-pressed=true],button.primary{background:#27573e;color:white;border-color:#27573e}.tabs,.actions{display:flex;gap:7px;flex-wrap:wrap}.scenario{padding:16px 0 20px;border-bottom:1px solid #e4e8e1}.steps{display:grid;gap:8px}.step{display:flex;gap:10px;align-items:center}.step span{font-size:11px;color:#8c9a8d}.step button{flex:1}.chat{display:flex;flex-direction:column;gap:13px;max-height:640px;overflow:auto;min-height:240px}.bubble{max-width:95%;padding:14px 16px;border-radius:10px;background:#f0f4ee;font-size:13px;line-height:1.8;white-space:pre-wrap}.bubble.user{background:#e4eee6;align-self:flex-end}.role{display:block;font-size:10px;color:#78917c;margin-bottom:5px}.result{border-left:3px solid #43845b;padding:13px 15px;background:#f6faf5;margin-top:10px;font-size:13px;line-height:1.8}.versions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.versions button{background:#f7faf5}.result.rejected{border-color:#a56f3b;background:#fff8ef}.notice{font-size:12px;padding:12px 0;color:#7d8b80;min-height:35px}details{margin-top:20px;font-size:12px;color:#758578}pre{white-space:pre-wrap;line-height:1.7}label{font-size:12px;display:block;margin:14px 0 8px}input{font:inherit;width:100%;padding:10px;border:1px solid #cad5c9;border-radius:5px;margin-bottom:8px}.scope{font-size:12px;line-height:1.8;border-top:1px solid #dce4d9;margin-top:17px;padding-top:12px}.footer{font-size:12px;margin-top:25px}@media(max-width:850px){.layout{grid-template-columns:1fr}.state{grid-template-columns:repeat(2,1fr)}main{padding:24px 15px 50px}.chat{max-height:none}}

<main><div class="kicker">PHOTO DIALOGUE / 使用体验原型</div><h1>一张照片，直接走到成图。</h1><p class="intro">这一轮判断流程是否顺手：什么时候直接做、什么时候只问一句、如何修改和处理失败。所有按钮都是模拟操作，不会上传照片、调用生成服务或创建图片文件。下方是待评审提案。</p>
<dl class="state" id="state" aria-live="polite"></dl>
<div class="layout"><section class="panel"><h2>按场景走一遍</h2><div class="tabs" id="tabs"></div><div class="scenario"><p id="description"></p><div class="steps" id="steps"></div></div><h3>自由尝试</h3><div class="actions" id="actions"></div><label for="revision">也可以输入一句修改要求（仅记录范围，不做真实理解与生成）</label><input id="revision" placeholder="例如：这句太肉麻，换得口语一点"><button id="custom">提交修改要求</button><div class="notice" id="notice" role="status"></div><details><summary>查看本轮状态与修改范围</summary><pre id="detail"></pre></details></section>
<section class="panel"><h2>用户实际看到的对话</h2><div class="chat" id="chat" aria-live="polite"></div><div id="result"></div><div class="scope" id="scope"></div></section></div>
<p class="footer">原型不等于生产实现。生成式修改以尽量保留未指定部分为目标；若核验发现无关人物、动作或构图变化，应判为修改失败，不能保证像素完全不变。</p></main>
<script>
// Pure interaction model: all data changes happen here, independent of the page.
const Flow=(()=>{
const initial=(config={})=>({phase:'empty',photo:false,authorized:false,scene:false,attribution:false,messages:[],versions:[],selected:null,currentRequest:null,attempts:0,error:null,notice:'',config});
const say=(s,role,text)=>s.messages.push({role,text});
function reducer(previous,action){const s=structuredClone(previous);s.notice='';
const reject=t=>{s.notice=t;return s};
if(action.type==='ATTACH'){
 if(s.phase!=='empty')return reject('本轮已有照片。请先重置场景，再模拟新照片；新照片不继承本轮授权。');
 s.photo=true;s.scene=!s.config.missingScene;s.authorized=!!s.config.priorConsent;s.attribution=!s.config.quoteUnknown;
 say(s,'user',s.config.quoteUnknown?'［示例照片］请把这句原话放上去：“再搅两下？”':s.config.missingScene?'［示例照片：窗边泡茶］帮我做一下。':'［示例照片］夫妻俩一起包饺子，帮我做一张。');
 if(!s.authorized){s.phase='authorization';say(s,'assistant','这次会把这张照片发送给图像生成服务，整体设计图片与文字。成图保存在本地，不公开发布。是否同意这样处理？');}
 else if(!s.attribution){s.phase='clarification';say(s,'assistant','这句原话是谁说的？告诉我照片中的位置就可以。');}
 else{s.phase='ready';say(s,'assistant',s.scene?'我会围绕一起包饺子的动作设计画面，保留两人的表情和互动。':'我先围绕照片里泡茶的动作做一版中性旁白，光色和排版由这张照片决定。');}
 return s;
}
if(action.type==='CONSENT'){
 if(s.phase!=='authorization')return reject('此时不需要再次确认授权。');
 s.authorized=true;s.phase=s.attribution?'ready':'clarification';say(s,'user','可以，按这个方式处理。');
 say(s,'assistant',s.attribution?'我开始按照片设计这一版。':'这句原话是谁说的？告诉我照片中的位置就可以。');return s;
}
if(action.type==='DECLINE'){
 if(s.phase!=='authorization')return reject('当前没有待回答的外发问题。');s.phase='declined';say(s,'user','不要把照片发出去。');say(s,'assistant','不会发送这张照片。这次的整体生成效果需要外部图像服务，目前无法按该流程完成。若你想做本地排版，可以另行选择，效果会有所不同。');return s;
}
if(action.type==='CLARIFY'){
 if(s.phase!=='clarification')return reject('当前没有影响生成的归属问题，不额外追问。');s.attribution=true;s.phase='ready';say(s,'user','是左边的人说的。');say(s,'assistant','明白，保留这句原话，并明确指向左边的人。');return s;
}
if(action.type==='START'){
 if(s.phase!=='ready')return reject('要先有本次授权，并解决影响准确性的必要问题。');s.phase='generating';s.attempts++;s.error=null;if(!s.currentRequest)s.currentRequest={kind:'first',text:'首次完整生成',base:null};return s;
}
if(action.type==='GENERATED'){
 if(s.phase!=='generating')return reject('当前没有正在进行的生成。');s.phase='checking';return s;
}
if(action.type==='PASS'){
 if(s.phase!=='checking')return reject('只有得到成图并检查后，才能交付。');
 const version=s.versions.length+1;const isEdit=s.currentRequest.kind!=='first';const item={version,label:'v'+version,filename:`photo-dialogue-v${String(version).padStart(2,'0')}.png`,request:s.currentRequest.text,base:s.currentRequest.base};s.versions.push(item);s.selected=version;s.phase='done';s.error=null;
 say(s,'assistant',isEdit?`已完成 ${item.label}：${s.currentRequest.text} 上一版保留，可随时切回。\n［成图预览］［下载 ${item.filename}］`:`已做好这一版。\n［成图预览］［下载 ${item.filename}］\n可以直接说哪里想改，比如“字小一点”或“这句太肉麻”。`);return s;
}
if(action.type==='FAIL_TEXT'||action.type==='FAIL_IDENTITY'||action.type==='FAIL_SERVICE'){
 if(!['checking','generating'].includes(s.phase))return reject('当前没有正在生成或核验的结果。');
 if(action.type!=='FAIL_SERVICE'&&s.phase!=='checking')return reject('应先拿到成图，再判断文字或人物是否有问题。');
 s.error=action.type==='FAIL_TEXT'?'中文有漏字':action.type==='FAIL_IDENTITY'?'人物的表情或手部发生变化':'生成服务暂时不可用';s.phase='failed';
 say(s,'assistant',`${s.error}，这次没有得到可交付的新版本。${s.versions.length?'已通过的上一版仍保留。':''}可以要求再试一次，或先停在这里。`);return s;
}
if(action.type==='RETRY'){
 if(s.phase!=='failed')return reject('只有失败后才需要重试。');say(s,'user','再试一次。');s.phase='generating';s.attempts++;s.error=null;say(s,'assistant','我再尝试一次，并重新检查；不会改变这次指定的照片和处理服务。');return s;
}
if(action.type==='REVISE_COPY'||action.type==='REVISE_LOOK'||action.type==='REVISE_POSITION'||action.type==='REVISE_CUSTOM'){
 if(!['done','failed'].includes(s.phase)||!s.selected)return reject('先生成一个通过检查的版本，再提出针对它的修改。');
 const kind=action.type==='REVISE_COPY'?'copy':action.type==='REVISE_LOOK'?'look':action.type==='REVISE_POSITION'?'placement':'custom';
 const utterance=kind==='copy'?'这句太肉麻，换得口语一点。':kind==='look'?'别这么黄，清透一点。':kind==='placement'?'别挡住左边的人，把文字挪开。':action.text;
 if(!utterance||!utterance.trim())return reject('先输入想修改的内容。');
 say(s,'user',utterance);s.currentRequest={kind,text:utterance,base:s.selected};s.phase='ready';
 const response=kind==='copy'?'我会改文案，尽量保留当前构图、光色和人物；只在新文字需要时调整排版。':kind==='look'?'我会减轻黄色、调整光色，保留文案、人物和主要构图。':kind==='placement'?'我会移动文字，避开左边的人，保留原有文案和整体氛围。':'已记录这次修改要求。［模拟：正式 Skill 会理解修改范围；有必要歧义时只问一句。］';say(s,'assistant',response);return s;
}
if(action.type==='SELECT'){
 const item=s.versions.find(v=>v.version===action.version);if(!item)return reject('该版本不存在。');if(['generating','checking'].includes(s.phase))return reject('先完成或停止当前尝试，再切换修改基准。');s.selected=item.version;s.phase='done';s.currentRequest=null;s.error=null;s.notice=`已选择 ${item.label}；下一次修改将以它为基准，其他版本保留。`;return s;
}
if(action.type==='STOP'){
 if(['generating','checking','failed','ready'].includes(s.phase)){s.phase=s.selected?'done':'stopped';s.currentRequest=null;s.error=null;say(s,'user','先停在这里。');say(s,'assistant',s.selected?'已停止，保留现有通过检查的版本。':'已停止，没有生成可交付的成图。');return s;}return reject('当前没有需要停止的尝试。');
}
return s;
}return {initial,reducer};})();
const scenarios=[
{name:'直接出图',description:'本次照片、服务与用途已明确授权。提交场景后直接处理，不再让用户选风格或确认同一授权。',config:{priorConsent:true},steps:[['提交照片与一句场景','ATTACH'],['开始生成','START'],['得到候选图','GENERATED'],['检查通过，交付一张','PASS']]},
{name:'只传照片',description:'用户没有提供关系或故事；照片可见动作足够支持中性旁白，就继续，不强制补填表单。',config:{priorConsent:true,missingScene:true},steps:[['只提交一张照片','ATTACH'],['使用中性叙事继续','START'],['得到候选图','GENERATED'],['检查并交付','PASS']]},
{name:'原话归属不清',description:'原话要原样保留，但说话者不清。只问这一件必要的事；回答后继续。',config:{priorConsent:true,quoteUnknown:true},steps:[['提交照片与原话','ATTACH'],['补充：左边的人说的','CLARIFY'],['开始生成','START'],['得到候选图','GENERATED'],['检查并交付','PASS']]},
{name:'首次外发',description:'没有当前处理授权。先说明服务、用途与这张照片，用户同意后再发送；拒绝时不能发送或擅自降级。',config:{},steps:[['提交照片','ATTACH'],['用户同意本次处理','CONSENT'],['开始生成','START'],['得到候选图','GENERATED'],['检查并交付','PASS']]},
{name:'只改一句话',description:'从已通过的成图继续，用户说“这句太肉麻”。保留上一版，尽量限制修改范围，并重新检查。',config:{priorConsent:true},steps:[['提交照片','ATTACH'],['开始生成','START'],['得到候选图','GENERATED'],['交付第一版','PASS'],['只改文案','REVISE_COPY'],['按指定范围修改','START'],['得到修改稿','GENERATED'],['检查后交付第二版','PASS']]},
{name:'修后人物变了',description:'改氛围时人物也变了：不能将它算成新成品。旧版保留，用户明确要求后只再尝试一次。',config:{priorConsent:true},steps:[['提交照片','ATTACH'],['开始生成','START'],['得到候选图','GENERATED'],['交付第一版','PASS'],['要求减轻黄色','REVISE_LOOK'],['开始修改','START'],['得到修改稿','GENERATED'],['发现人物变化','FAIL_IDENTITY'],['用户要求再试一次','RETRY'],['得到重试结果','GENERATED'],['检查通过才交付','PASS']]},
{name:'拒绝外发',description:'外发未获授权，流程停止。用户不接受外发并不等于授权制作本地简版。',config:{},steps:[['提交照片','ATTACH'],['用户拒绝外发','DECLINE']]}
];
const actions=[['提交照片','ATTACH'],['同意外发','CONSENT'],['拒绝外发','DECLINE'],['补充原话归属','CLARIFY'],['开始生成 / 修改','START'],['得到候选图','GENERATED'],['核验通过','PASS'],['发现错字','FAIL_TEXT'],['人物变样','FAIL_IDENTITY'],['服务不可用','FAIL_SERVICE'],['明确再试一次','RETRY'],['文案太肉麻','REVISE_COPY'],['减轻黄色','REVISE_LOOK'],['移动文字','REVISE_POSITION'],['停止当前尝试','STOP']];
let freeMode=false;let scenarioIndex=0,stepIndex=0,state=Flow.initial(scenarios[0].config);
const phases={empty:'等待照片',authorization:'等待本次外发授权',clarification:'等待一句必要澄清',ready:'可以开始',generating:'生成 / 修改中',checking:'核对人物与文字',done:'已有可交付版本',failed:'本次尝试失败',declined:'未获外发授权，已停止',stopped:'已停止'};
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function render(){const pairs=[['当前进度',phases[state.phase]],['照片',state.photo?'本轮示例照片':'未提交'],['当次授权',state.authorized?'已明确，可沿用':'未取得'],['背景与归属',state.photo?(!state.attribution?'原话归属待澄清':state.scene?'已有用户描述':'中性叙事继续'):'尚未判断'],['已有成品',state.versions.length+' 个'],['修改基准',state.selected?'v'+state.selected:'无'],['模拟调用次数',state.attempts+' 次'],['上次问题',state.error||'无']];const panel=document.querySelector('#state');panel.replaceChildren();pairs.forEach(([k,v])=>{const box=element('div');box.append(element('dt','',k),element('dd','',v));panel.append(box)});
document.querySelector('#description').textContent=scenarios[scenarioIndex].description;document.querySelectorAll('#tabs button').forEach((b,i)=>b.setAttribute('aria-pressed',i===scenarioIndex));const steps=document.querySelector('#steps');steps.replaceChildren();if(freeMode)steps.append(element('p','','当前为自由尝试。重新点击场景标签，可从第一步开始导览。'));scenarios[scenarioIndex].steps.forEach(([name,type],i)=>{const row=element('div','step');row.append(element('span','',i<stepIndex?'✓':String(i+1)));const button=element('button',i===stepIndex?'primary':'',name);button.disabled=freeMode||i!==stepIndex;button.onclick=()=>{state=Flow.reducer(state,{type});if(!state.notice)stepIndex++;render()};row.append(button);steps.append(row)});
const chat=document.querySelector('#chat');chat.replaceChildren();if(!state.messages.length)chat.append(element('p','','点左边的第一步，开始模拟。'));state.messages.forEach(m=>{const b=element('div','bubble '+m.role);b.append(element('span','role',m.role==='user'?'用户':'照片有话说'),document.createTextNode(m.text));chat.append(b)});chat.scrollTop=chat.scrollHeight;
const result=document.querySelector('#result');result.replaceChildren();if(state.selected){const item=state.versions.find(v=>v.version===state.selected);const block=element('div','result',`当前选择：${item.label}\n模拟交付：${item.filename}\n图片在对话中预览，同时提供本地文件链接。`);block.style.whiteSpace='pre-wrap';result.append(block);const versions=element('div','versions');state.versions.forEach(v=>{const b=element('button','',`选择 ${v.label}`);b.setAttribute('aria-pressed',v.version===state.selected);b.onclick=()=>dispatch({type:'SELECT',version:v.version});versions.append(b)});result.append(versions)}if(state.phase==='failed')result.append(element('div','result rejected','本次失败结果不计入可交付版本，不覆盖已有成图。'));
document.querySelector('#scope').textContent=state.currentRequest?`本次目标：${state.currentRequest.text}\n基于：${state.currentRequest.base?'v'+state.currentRequest.base:'源照片'}。最终仍须检查未指定部分有无明显变化。`:'默认只展示成图和简短说明；提示词、处理记录是否额外交付仍待本轮决定。';document.querySelector('#notice').textContent=state.notice;document.querySelector('#detail').textContent=`授权仅适用于本轮示例照片与当前服务。\n本轮修改：${state.currentRequest?state.currentRequest.text:'无'}\n已通过版本：${state.versions.map(v=>v.label+' ← '+(v.base?'v'+v.base:'源照片')).join('；')||'无'}\n待核验结果不会进入版本列表。\n流程和按钮均为模拟，不产生真实外部调用。`;}
function dispatch(action){freeMode=true;state=Flow.reducer(state,action);render()}
scenarios.forEach((s,i)=>{const b=element('button','',s.name);b.onclick=()=>{scenarioIndex=i;stepIndex=0;freeMode=false;state=Flow.initial(s.config);render()};document.querySelector('#tabs').append(b)});actions.forEach(([name,type])=>{const b=element('button','',name);b.onclick=()=>dispatch({type});document.querySelector('#actions').append(b)});const reset=element('button','','重置当前场景');reset.onclick=()=>{state=Flow.initial(scenarios[scenarioIndex].config);stepIndex=0;freeMode=false;render()};document.querySelector('#actions').append(reset);document.querySelector('#custom').onclick=()=>dispatch({type:'REVISE_CUSTOM',text:document.querySelector('#revision').value});render();
</script></html>
