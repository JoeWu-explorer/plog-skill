<main><div class="kicker">PHOTO DIALOGUE / 使用体验原型</div><h1>照片有话说</h1><p class="intro">对话评审原型：首次确认、修改、旧版选择与失败处理。所有按钮都是模拟操作，不会上传照片、调用生成服务或创建图片文件。</p>
<dl class="state" id="state" aria-live="polite"></dl>
<div class="layout"><section class="panel"><h2>按场景走一遍</h2><div class="tabs" id="tabs"></div><div class="scenario"><p id="description"></p><div class="steps" id="steps"></div></div><h3>自由尝试</h3><div class="actions" id="actions"></div><label for="revision">也可以输入一句修改要求（仅记录范围，不做真实理解与生成）</label><input id="revision" placeholder="例如：这句太肉麻，换得口语一点"><button id="custom">提交修改要求</button><div class="notice" id="notice" role="status"></div><details><summary>查看本轮状态与修改范围</summary><pre id="detail"></pre></details></section>
<section class="panel"><h2>用户实际看到的对话</h2><div class="chat" id="chat" aria-live="polite"></div><div id="result"></div><div class="scope" id="scope"></div></section></div>
<p class="footer">本原型对应已确认的使用体验决议，仍不等于生产实现。生成式修改以尽量保留未指定部分为目标；若核验发现无关人物、动作或构图变化，应判为修改失败，不能保证像素完全不变。</p></main>
<script>
// Pure interaction model: all data changes happen here, independent of the page.
const Flow=(()=>{
const initial=(config={})=>({phase:'empty',photo:false,authorized:false,scene:false,attribution:false,messages:[],versions:[],selected:null,currentRequest:null,attempts:0,error:null,notice:'',config});
const say=(s,role,text)=>s.messages.push({role,text});
const direction=s=>s.config.quoteUnknown?'我会保留这句原话，围绕照片中的动作来排版。':s.scene?'我会围绕一起包饺子的动作配一句轻松的对白，保留两人的表情和互动。':'我会围绕泡茶的动作配一句旁白，让画面保持清透、自然。';
function reducer(previous,action){const s=structuredClone(previous);s.notice='';
const reject=t=>{s.notice=t;return s};
if(action.type==='ATTACH'){
 if(s.phase!=='empty')return reject('本轮已有照片。请先重置场景，再模拟新照片；新照片不继承本轮授权。');
 s.photo=true;s.scene=!s.config.missingScene;s.authorized=!!s.config.priorConsent;s.attribution=!s.config.quoteUnknown;
 say(s,'user',s.config.quoteUnknown?'［示例照片］请把这句原话放上去：“再搅两下？”':s.config.missingScene?'［示例照片：窗边泡茶］帮我做一下。':'［示例照片］夫妻俩一起包饺子，帮我做一张。');
 if(!s.authorized){s.phase='authorization';say(s,'assistant','我会把这张照片交给 Codex 图像服务，配上中文并做成图片。这次同意仅限这张照片的生成和后续修改，成图会保存到你的电脑。可以开始吗？');}
 else if(!s.attribution){s.phase='clarification';say(s,'assistant','这句话是照片里的哪位说的？说左边或右边就好。');}
 else{s.phase='ready';say(s,'assistant',direction(s));}
 return s;
}
if(action.type==='CONSENT'){
 if(s.phase!=='authorization')return reject('现在不需要重复确认。');
 s.authorized=true;s.phase=s.attribution?'ready':'clarification';say(s,'user','可以。');
 say(s,'assistant',s.attribution?direction(s):'这句话是照片里的哪位说的？说左边或右边就好。');return s;
}
if(action.type==='DECLINE'){
 if(s.phase!=='authorization')return reject('现在没有需要回答的处理确认。');s.phase='declined';say(s,'user','不要把照片发出去。');say(s,'assistant','好，这次不交给图像服务处理。也可以先聊聊配什么文字。');return s;
}
if(action.type==='CLARIFY'){
 if(s.phase!=='clarification')return reject('现在没有需要补充的说话者信息。');s.attribution=true;s.phase='ready';say(s,'user','是左边的人说的。');say(s,'assistant','好，这句原话放在左边那位旁边，文字原样保留。');return s;
}
if(action.type==='START'){
 if(s.phase!=='ready')return reject('请先完成当前的确认或补充信息，再开始。');s.phase='generating';s.attempts++;s.error=null;if(!s.currentRequest)s.currentRequest={kind:'first',text:'制作第一版',base:null};return s;
}
if(action.type==='GENERATED'){
 if(s.phase!=='generating')return reject('当前没有正在进行的生成。');s.phase='checking';return s;
}
if(action.type==='PASS'){
 if(s.phase!=='checking')return reject('只有得到成图并检查后，才能交付。');
 const version=s.versions.length+1;const isEdit=s.currentRequest.kind!=='first';const item={version,label:'第'+version+'版',filename:`photo-dialogue-v${String(version).padStart(2,'0')}.png`,request:s.currentRequest.text,base:s.currentRequest.base};s.versions.push(item);s.selected=version;s.phase='done';s.error=null;
 const completed={copy:'改好了，这句更口语了。',look:'改好了，这版的颜色更清透了。',placement:'改好了，文字已经挪开左边的人物。',custom:'已按你的要求改好。'};
 const first=s.config.quoteUnknown?'做好了，你提供的原话已原样放进图片。':s.scene?'做好了，配了一句轻松的对白。这句是创作配文。':'做好了，配了一句泡茶时的旁白。';
 say(s,'assistant',isEdit?`${completed[s.currentRequest.kind]} 之前的版本也留着。\n［第${version}版预览］［下载第${version}版］`:`${first}\n［成图预览］［下载图片］\n想调整的话，直接说“这句再口语一点”就好。`);return s;
}
if(action.type==='FAIL_TEXT'||action.type==='FAIL_IDENTITY'||action.type==='FAIL_SERVICE'){
 if(!['checking','generating'].includes(s.phase))return reject('现在没有正在生成或检查的图片。');
 if(action.type!=='FAIL_SERVICE'&&s.phase!=='checking')return reject('应先拿到成图，再判断文字或人物是否有问题。');
 s.error=action.type==='FAIL_TEXT'?'文字漏了一个字':action.type==='FAIL_IDENTITY'?'人物的手部变了':'图像服务暂时不可用';s.phase='failed';
 const reason=action.type==='FAIL_TEXT'?'这次生成的文字漏了一个字，还不能作为成品。':action.type==='FAIL_IDENTITY'?'这次生成时，人物的手部也变了，所以没保存为新版本。':'这次没能生成图片，图像服务暂时不可用。';
 say(s,'assistant',`${reason}${s.versions.length?'之前保存的版本还在。':''}${s.currentRequest.retries?'先停在这里。':action.type==='FAIL_SERVICE'?'可以稍后再试。':'可以再试一次。'}`);return s;
}
if(action.type==='RETRY'){
 if(s.phase!=='failed')return reject('只有失败后才需要重试。');say(s,'user','再试一次。');s.phase='generating';s.attempts++;s.currentRequest.retries=(s.currentRequest.retries||0)+1;s.error=null;say(s,'assistant','好，我按刚才的要求再试一次。');return s;
}
if(action.type==='REVISE_COPY'||action.type==='REVISE_LOOK'||action.type==='REVISE_POSITION'||action.type==='REVISE_CUSTOM'){
 if(!['done','failed'].includes(s.phase)||!s.selected)return reject('先生成一个通过检查的版本，再提出针对它的修改。');
 const kind=action.type==='REVISE_COPY'?'copy':action.type==='REVISE_LOOK'?'look':action.type==='REVISE_POSITION'?'placement':'custom';
 const utterance=kind==='copy'?'这句太肉麻，换得口语一点。':kind==='look'?'别这么黄，清透一点。':kind==='placement'?'别挡住左边的人，把文字挪开。':action.text;
 if(!utterance||!utterance.trim())return reject('先输入想修改的内容。');
 say(s,'user',utterance);s.currentRequest={kind,text:utterance,base:s.selected};s.phase='ready';
 const response=kind==='copy'?'好，把这句改得更口语一点，画面的光色和布局尽量保持。':kind==='look'?'我会把黄色调淡一些，让画面更清透，文字照旧。':kind==='placement'?'我会把字挪开，露出左边的人物，文案照旧。':'这句修改要求已记下。';say(s,'assistant',response);if(kind==='custom')s.notice='模拟原型只记录输入；正式技能会理解要求，必要时询问。';return s;
}
if(action.type==='SELECT'){
 const item=s.versions.find(v=>v.version===action.version);if(!item)return reject('没找到这一版。');if(['generating','checking'].includes(s.phase))return reject('先完成或停止当前处理，再选择其他版本。');s.selected=item.version;s.phase='done';s.currentRequest=null;s.error=null;say(s,'user',`回到${item.label}。`);say(s,'assistant',`好，这是${item.label}，接下来可以从这版继续改。\n［${item.label}预览］［下载${item.label}］`);return s;
}
if(action.type==='STOP'){
 if(['generating','checking','failed','ready','authorization','clarification'].includes(s.phase)){const pending=s.phase==='generating';s.phase=s.selected?'done':'stopped';s.currentRequest=null;s.error=null;say(s,'user','先停在这里。');say(s,'assistant',`${pending?'好，我会停止后续处理。已经发出的生成任务暂时无法取消，返回的图片也不会保存为新版本。':'好，先停在这里。'}${s.selected?'已保存的版本都留着。':''}`);return s;}return reject('当前没有需要停止的尝试。');
}
return s;
}return {initial,reducer};})();
const scenarios=[
{name:'直接出图',description:'本次照片、服务与用途已明确授权。提交场景后直接处理，不再让用户选风格或确认同一授权。',config:{priorConsent:true},steps:[['提交照片与一句场景','ATTACH'],['开始生成','START'],['得到候选图','GENERATED'],['检查通过，交付一张','PASS']]},
{name:'只传照片',description:'用户没有提供关系或故事；照片可见动作足够支持中性旁白，就继续，不强制补填表单。',config:{priorConsent:true,missingScene:true},steps:[['只提交一张照片','ATTACH'],['使用中性叙事继续','START'],['得到候选图','GENERATED'],['检查并交付','PASS']]},
{name:'原话归属不清',description:'原话要原样保留，但说话者不清。只问这一件必要的事；回答后继续。',config:{priorConsent:true,quoteUnknown:true},steps:[['提交照片与原话','ATTACH'],['补充：左边的人说的','CLARIFY'],['开始生成','START'],['得到候选图','GENERATED'],['检查并交付','PASS']]},
{name:'首次确认',description:'还没有当前照片的处理同意。先用日常语言说明处理方式、用途与本次范围；拒绝时不能发送或擅自降级。',config:{},steps:[['提交照片','ATTACH'],['用户同意本次处理','CONSENT'],['开始生成','START'],['得到候选图','GENERATED'],['检查并交付','PASS']]},
{name:'只改一句话',description:'从已通过的成图继续，用户说“这句太肉麻”。保留上一版，尽量限制修改范围，并重新检查。',config:{priorConsent:true},steps:[['提交照片','ATTACH'],['开始生成','START'],['得到候选图','GENERATED'],['交付第一版','PASS'],['只改文案','REVISE_COPY'],['按指定范围修改','START'],['得到修改稿','GENERATED'],['检查后交付第二版','PASS']]},
{name:'修后人物变了',description:'改氛围时人物也变了：不能将它算成新成品。旧版保留，用户明确要求后只再尝试一次。',config:{priorConsent:true},steps:[['提交照片','ATTACH'],['开始生成','START'],['得到候选图','GENERATED'],['交付第一版','PASS'],['要求减轻黄色','REVISE_LOOK'],['开始修改','START'],['得到修改稿','GENERATED'],['发现人物变化','FAIL_IDENTITY'],['用户要求再试一次','RETRY'],['得到重试结果','GENERATED'],['检查通过才交付','PASS']]},
{name:'从旧版继续',description:'先做两版，再回到第一版移动文字。选择旧版不重新生成；只有提出修改并开始后才增加一次调用。',config:{priorConsent:true},steps:[['提交照片','ATTACH'],['开始生成','START'],['得到图片','GENERATED'],['交付第一版','PASS'],['调整光色','REVISE_LOOK'],['开始修改','START'],['得到图片','GENERATED'],['交付第二版','PASS'],['回到第一版','SELECT',1],['移动文字','REVISE_POSITION'],['开始修改','START'],['得到图片','GENERATED'],['交付第三版，第一版保留','PASS']]},
{name:'服务暂不可用',description:'没有拿到图片时直接说明；用户说再试一次就承接，若仍然失败则停下。',config:{priorConsent:true},steps:[['提交照片','ATTACH'],['开始生成','START'],['服务暂不可用','FAIL_SERVICE'],['用户要求再试一次','RETRY'],['服务仍不可用','FAIL_SERVICE']]},
{name:'文字有漏字',description:'说明具体文字问题，未完成稿不作为成品；用户明确重试后才继续。',config:{priorConsent:true},steps:[['提交照片','ATTACH'],['开始生成','START'],['得到图片','GENERATED'],['发现漏字','FAIL_TEXT'],['用户要求再试一次','RETRY'],['得到图片','GENERATED'],['检查后交付','PASS']]},
{name:'中途停止',description:'用户在修改时停止，保留已有版本。模拟已发出的任务无法取消，迟到的结果也不会成为新版本。',config:{priorConsent:true},steps:[['提交照片','ATTACH'],['开始生成','START'],['得到图片','GENERATED'],['交付第一版','PASS'],['修改文案','REVISE_COPY'],['开始修改','START'],['用户说先停下','STOP']]},
{name:'拒绝处理',description:'当前照片未获处理同意，流程停止。用户不接受图像处理并不等于授权制作本地简版。',config:{},steps:[['提交照片','ATTACH'],['用户拒绝处理','DECLINE']]}
];
const actions=[['提交照片','ATTACH'],['同意处理','CONSENT'],['暂不处理','DECLINE'],['补充原话归属','CLARIFY'],['开始生成 / 修改','START'],['得到候选图','GENERATED'],['核验通过','PASS'],['发现错字','FAIL_TEXT'],['人物变样','FAIL_IDENTITY'],['服务不可用','FAIL_SERVICE'],['明确再试一次','RETRY'],['文案太肉麻','REVISE_COPY'],['减轻黄色','REVISE_LOOK'],['移动文字','REVISE_POSITION'],['停止当前尝试','STOP']];
let freeMode=false;let scenarioIndex=scenarios.findIndex(s=>s.name==='首次确认'),stepIndex=0,state=Flow.initial(scenarios[scenarioIndex].config);
const phases={empty:'等待照片',authorization:'等待你的确认',clarification:'等待补充说话者',ready:'可以开始',generating:'生成 / 修改中',checking:'检查人物与文字',done:'图片已保存',failed:'这次没能完成',declined:'暂不处理',stopped:'已停止'};
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}

const chat=document.querySelector('#chat');chat.replaceChildren();if(!state.messages.length)chat.append(element('p','','点左边的第一步，开始模拟。'));state.messages.forEach(m=>{const b=element('div','bubble '+m.role);b.append(element('span','role',m.role==='user'?'用户':'照片有话说'),document.createTextNode(m.text));chat.append(b)});chat.scrollTop=chat.scrollHeight;
const result=document.querySelector('#result');result.replaceChildren();if(state.selected){const item=state.versions.find(v=>v.version===state.selected);const block=element('div','result',`当前选择：${item.label}\n模拟交付：${item.filename}\n图片在对话中预览，同时提供本地文件链接。`);block.style.whiteSpace='pre-wrap';result.append(block);const versions=element('div','versions');state.versions.forEach(v=>{const b=element('button','',`选择 ${v.label}`);b.setAttribute('aria-pressed',v.version===state.selected);b.onclick=()=>dispatch({type:'SELECT',version:v.version});versions.append(b)});result.append(versions)}if(state.phase==='failed')result.append(element('div','result rejected','本次失败结果不计入可交付版本，不覆盖已有成图。'));
document.querySelector('#scope').textContent=state.currentRequest?`本次要求：${state.currentRequest.text}\n从${state.currentRequest.base?'第'+state.currentRequest.base+'版':'原照片'}开始。`:'成图会附图片预览和下载链接。';document.querySelector('#notice').textContent=state.notice;document.querySelector('#detail').textContent=`同意仅适用于本轮示例照片、当前服务和这次生成/修改。\n本轮修改：${state.currentRequest?state.currentRequest.text:'无'}\n已通过版本：${state.versions.map(v=>v.label+' ← '+(v.base?'v'+v.base:'源照片')).join('；')||'无'}\n待核验结果不会进入版本列表。\n流程和按钮均为模拟，不产生真实外部调用。`;}
function dispatch(action){freeMode=true;state=Flow.reducer(state,action);render()}
scenarios.forEach((s,i)=>{const b=element('button','',s.name);b.onclick=()=>{scenarioIndex=i;stepIndex=0;freeMode=false;state=Flow.initial(s.config);render()};document.querySelector('#tabs').append(b)});actions.forEach(([name,type])=>{const b=element('button','',name);b.onclick=()=>dispatch({type});document.querySelector('#actions').append(b)});const reset=element('button','','重置当前场景');reset.onclick=()=>{state=Flow.initial(scenarios[scenarioIndex].config);stepIndex=0;freeMode=false;render()};document.querySelector('#actions').append(reset);document.querySelector('#custom').onclick=()=>dispatch({type:'REVISE_CUSTOM',text:document.querySelector('#revision').value});render();
</script></html>
