<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暖纸 × 暖胶片 · 重构样片</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2eee5;color:#4c3b2c;font-family:-apple-system,"PingFang SC",sans-serif}main{max-width:1300px;margin:auto;padding:25px 20px 70px}h1{font:500 34px "Songti SC",serif;margin:12px 0}p{font-size:14px;line-height:1.8;color:#806c57}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}button,a{font:inherit;font-size:13px;cursor:pointer;color:inherit;padding:10px 14px;border:1px solid #c9b59d;background:#faf6ec;text-decoration:none;border-radius:4px}button[aria-pressed=true]{background:#573c27;color:#fff3dd}.art{display:block;width:100%;height:auto}figure{margin:0}.note{font-size:12px}header{max-width:800px}</style>
<main><header><p>PHOTO DIALOGUE / Strong Look 视觉试验</p><h1>把日子，包进饺子里。</h1><p>在同一张照片上比较原图、整体编辑设计，以及进一步加入胶片氛围的版本。原图中的两位人物均为虚构测试人物；后两张使用图像模型编辑，尚未通过用户验收。</p></header><div class="controls" id="controls"></div><figure><img class="art" id="art" alt=""><figcaption><p id="description"></p></figcaption></figure><p class="note">观察：人物有没有变样、肤色是否自然、氛围是否合适、文字是否与照片协调。当前暖胶片仍偏暖黄，冷暖分离没有完全达到预期；暂不作为正式视觉标准。</p><a id="download" download>下载当前图片</a></main>
<script>const variants=[{id:'source',name:'原照片',src:'../../tests/fixtures/source-photos/02-spouses-cooking.png',description:'原照片：夫妻一起包饺子，保持原始光色。'},{id:'editorial',name:'整体编辑设计',src:'generated/strong-warm-editorial-v1.png',description:'第一版：暖纸背景、锈红展示字与照片共同构图。生成模型同时处理人物、背景和文字。'},{id:'film',name:'暖胶片氛围',src:'generated/strong-warm-film-v2.png',description:'第二版：增加胶片颗粒、暗部深度与柔和光色。人物、手与构图存在生成式细节变化，需要与原图一起评审。'}];let current=Math.max(0,variants.findIndex(x=>x.id===(new URLSearchParams(location.search).get('variant')||'film')));function render(){const v=variants[current];document.querySelector('#art').src=v.src;document.querySelector('#art').alt=v.name+'：'+v.description;document.querySelector('#description').textContent=v.description;document.querySelector('#download').href=v.src;document.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',i===current));history.replaceState(null,'','?variant='+v.id)}variants.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v.name;b.onclick=()=>{current=i;render()};document.querySelector('#controls').append(b)});window.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable=true]'))return;if(e.key==='ArrowRight')current=(current+1)%3;else if(e.key==='ArrowLeft')current=(current+2)%3;else return;render()});render();</script></html>
