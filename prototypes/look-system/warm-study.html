<!doctype html>
<!-- THROWAWAY: B warm-paper direction across three established Recipes. Manual positions are illustration only, never production detector output. -->
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>暖纸家庭 · 完整样片</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e9;color:#47392d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1260px;margin:auto;padding:34px 30px 112px}.kicker{font-size:11px;letter-spacing:.16em;color:#8c705b}h1{font-family:"Songti SC",serif;font-size:clamp(32px,5vw,60px);font-weight:500;margin:12px 0 18px}header{max-width:780px}p{line-height:1.8}.intro{color:#867160;font-size:14px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0}button,a.link{font:inherit;color:inherit;border:1px solid #c9bba8;border-radius:4px;padding:9px 13px;background:#faf7ef;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#563e2c;color:#fff8e8;border-color:#563e2c}.stage{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:34px;align-items:start}.art{max-width:850px;margin:0;background:#f5e8d1;box-shadow:0 16px 45px #50331c18}.art.portrait{max-width:510px;margin-inline:auto}.art svg{width:100%;height:auto;display:block}.art text{font-family:"Songti SC","Noto Serif CJK SC",serif}.art.before .voices{visibility:hidden}aside{font-size:13px;border-top:1px solid #cdbda9;padding-top:16px}aside h2{font-size:18px;font-weight:500;margin:0 0 14px}aside p{margin:0 0 18px}.small{color:#927b66;font-size:12px}.switch{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;padding:7px 10px;background:#493b2e;color:#fff8eb;border-radius:9px;box-shadow:0 7px 25px #493b2e30;white-space:nowrap}.switch button{background:#f6eddf;border:0;color:#493b2e}.switch span{font-size:13px;min-width:124px;text-align:center}.caption{font-size:12px;line-height:1.7;color:#95806c;margin-top:20px}.status{min-height:18px;color:#776552;font-size:12px}@media(max-width:760px){main{padding:24px 16px 108px}.stage{grid-template-columns:1fr;gap:24px}h1{font-size:36px}.toolbar{gap:8px}.toolbar button{font-size:12px}aside{max-width:510px}.art.portrait{max-width:450px}}
</style>
<main>
<header><div class="kicker">PHOTO DIALOGUE / B · 第二轮视觉原型</div><h1>让话语，走进照片里。</h1><p class="intro">同一种暖纸气质，三种文字进入照片的方式。查看成图，也可以随时切回原照片。这里的对白与内心声音均为创作。</p></header>
<div class="toolbar"><div id="tabs"></div><button id="before" aria-pressed="false">查看原照片</button><button id="save">下载当前样片 SVG</button></div>
<div class="stage"><div><figure class="art" id="art"></figure><div class="caption">虚构人物测试素材 · 完整保留原照片 · 手工排版原型<br>文字与气泡位置用于视觉讨论，尚未经过生产级人物安全检测。</div><div class="status" id="status" role="status"></div></div><aside><h2 id="title"></h2><p id="story"></p><p id="design"></p><p class="small">重点看：第一眼是否回到人物，文字是否自然，以及你是否愿意保存这张成图。横向样片可横屏或放大查看。</p><p class="small">字体目前使用本机宋体；SVG 是评审素材，正式中文字体与 PNG 导出仍需后续实现。</p><a class="link" href="./?variant=B">返回风格对照</a></aside></div>
</main>
<div class="switch"><button id="prev" aria-label="上一张">←</button><span id="current"></span><button id="next" aria-label="下一张">→</button></div>
<script>
const base='../../tests/fixtures/source-photos/';
const defs=`<defs><pattern id="paper" width="13" height="17" patternUnits="userSpaceOnUse"><rect width="13" height="17" fill="#f8ecd5"/><path d="M2 4h2M8 12h1" stroke="#b0926b" stroke-width=".7" opacity=".18"/></pattern><filter id="lift" x="-15%" y="-15%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#372a19" flood-opacity=".15"/></filter></defs>`;
const cases=[
{id:'single',title:'单声画内 · 留一点慢',file:'01-solo-tea.png',w:1024,h:1535,extra:0,story:'周末早晨，她独自在窗边泡茶。创作内心声音从上方留白落向人物，保留倒水与杯子之间的动作。',design:'柔软的纸形承接两行宋体，短尾指向人物；照片的灰绿与木色仍是画面主体。',voice:`<g class="voices"><path d="M212 290 C266 269 561 276 634 310 C677 331 679 443 643 480 C615 510 519 514 465 512 Q460 552 425 594 Q440 548 423 515 C332 518 225 514 192 482 C152 444 158 329 212 290Z" fill="url(#paper)" stroke="#ba9d76" stroke-width="2" filter="url(#lift)"/><text x="420" y="374" text-anchor="middle" fill="#56422e" font-size="53" letter-spacing="2"><tspan x="420">今天的进度，</tspan><tspan x="420" dy="80">先到这一杯。</tspan></text></g>`},
{id:'pair',title:'双声画内 · 厨房搭档',file:'02-spouses-cooking.png',w:1536,h:1024,extra:0,story:'夫妻一起包饺子，丈夫帮妻子搅馅。左侧一句发起，右上方一句回应，阅读最后落回两人的笑容和手中的碗。',design:'两只纸气泡沿人物外侧错位排列。尾巴在空白处结束，不穿过脸部，也不横穿两人之间的互动。',voice:`<g class="voices"><g fill="url(#paper)" stroke="#b39470" stroke-width="2" filter="url(#lift)"><path d="M104 244 Q112 218 155 213 Q329 204 449 226 Q499 240 499 289 L498 324 Q526 352 647 384 Q547 380 480 357 Q397 393 151 376 Q104 372 97 335 Q85 280 104 244Z"/><path d="M606 43 Q790 18 969 46 Q1004 54 1007 88 L1008 135 Q1009 176 1027 213 Q988 198 967 176 Q820 201 652 178 Q610 173 603 141 Q586 80 606 43Z"/></g><text x="298" y="316" text-anchor="middle" fill="#57402a" font-size="62">再搅两下？</text><text x="804" y="96" text-anchor="middle" fill="#57402a" font-size="51"><tspan x="804">收到，</tspan><tspan x="804" dy="65">马上开包。</tspan></text></g>`},
{id:'group',title:'画外旁白 · 一桌热闹',file:'06-six-person-lunch.png',w:1536,h:1024,extra:208,story:'一家六口传递同一道菜。照片里已经有完整的动作与视线，下方用一句旁白接住这个瞬间。',design:'从木桌借来温暖的叙事底色。短线与文字共用中轴，留出呼吸；不把多个人的声音挤进拥挤照片。',voice:`<g class="voices"><rect y="1024" width="1536" height="208" fill="url(#paper)"/><path d="M744 1070h48" stroke="#a97446" stroke-width="3"/><text x="768" y="1161" text-anchor="middle" fill="#604731" font-size="61" letter-spacing="3">传一碗菜，接一桌热闹。</text></g>`}
];
const q=new URLSearchParams(location.search);let ix=Math.max(0,cases.findIndex(c=>c.id===q.get('variant'))),original=false;
const art=document.querySelector('#art');
function render(){const c=cases[ix];const height=c.h+(original?0:c.extra);art.className='art'+(c.w<c.h?' portrait':'')+(original?' before':'');art.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${c.w} ${height}" role="img" aria-label="${c.title}${original?'原照片':'创作样片'}">${defs}<image href="${base+c.file}" width="${c.w}" height="${c.h}"/>${c.voice}</svg>`;document.querySelector('#title').textContent=c.title;document.querySelector('#story').textContent=c.story;document.querySelector('#design').textContent=c.design;document.querySelector('#current').textContent=`${ix+1} / 3 · ${c.title.split(' · ')[0]}`;document.querySelector('#before').textContent=original?'返回成图':'查看原照片';document.querySelector('#before').setAttribute('aria-pressed',original);document.querySelectorAll('#tabs button').forEach((b,j)=>b.setAttribute('aria-pressed',ix===j));history.replaceState(null,'','?variant='+c.id);document.querySelector('#status').textContent='';}
cases.forEach((c,j)=>{const b=document.createElement('button');b.textContent=c.title.split(' · ')[0];b.onclick=()=>{ix=j;original=false;render()};document.querySelector('#tabs').append(b)});
function cycle(n){ix=(ix+n+3)%3;original=false;render()}
document.querySelector('#before').onclick=()=>{original=!original;render()};document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);
window.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable=true]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});
document.querySelector('#save').onclick=async()=>{const c=cases[ix];const clone=art.querySelector('svg').cloneNode(true);const response=await fetch(base+c.file);const data=await response.blob();const reader=new FileReader();reader.onload=()=>{clone.querySelector('image').setAttribute('href',reader.result);if(original)clone.querySelector('.voices').remove();const fontStyle=document.createElementNS('http://www.w3.org/2000/svg','style');fontStyle.textContent='text{font-family:"Songti SC","Noto Serif CJK SC",serif}';clone.prepend(fontStyle);const blob=new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`warm-paper-${c.id}${original?'-source':''}.svg`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('#status').textContent='已生成内嵌照片的 SVG 下载；在其他设备查看时字体可能不同。';};reader.readAsDataURL(data);};render();
</script>
</html>
